<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Copy Lab" />
  <meta name="theme-color" content="#0f1115" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/icon-180.png" />
  <title>Copy Lab</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #0f1115; color: #e8eaed; margin: 0;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(15, 17, 21, 0.92); backdrop-filter: blur(12px);
      padding: 14px 16px 10px; border-bottom: 1px solid #23272f;
    }
    h1 { font-size: 1.15rem; margin: 0 0 4px; font-weight: 700; }
    .summary { color: #9aa0a6; font-size: 0.9rem; }
    .positive { color: #3dd68c; }
    .negative { color: #f87171; }
    .controls { display: flex; gap: 8px; padding: 12px 16px; }
    button {
      flex: 1; background: #1a73e8; color: #fff; border: 0;
      padding: 12px 0; border-radius: 12px; cursor: pointer;
      font-size: 0.95rem; font-weight: 600;
    }
    button.secondary { background: #2a2f38; }
    button:active { opacity: 0.7; }
    .list { padding: 0 12px 24px; }
    .card {
      display: flex; align-items: center; gap: 12px;
      background: #171a20; border-radius: 14px; padding: 12px 14px;
      margin-bottom: 8px; border-left: 4px solid transparent;
    }
    .card.win { border-left-color: #3dd68c; }
    .card.loss { border-left-color: #f87171; }
    .card .meta { flex: 1; min-width: 0; }
    .card .market {
      font-size: 0.9rem; font-weight: 600; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .card .sub { font-size: 0.78rem; color: #9aa0a6; margin-top: 2px; }
    .card .pnl { font-size: 1rem; font-weight: 700; white-space: nowrap; }
    .badge {
      display: inline-block; background: #22262e; border-radius: 20px;
      padding: 2px 10px; font-size: 0.72rem; color: #c7cbd1;
    }
    .warn {
      background: #3c2f00; color: #fdd663; padding: 12px;
      border-radius: 12px; margin: 12px 16px; font-size: 0.85rem;
    }
    .empty { text-align: center; color: #5f6368; padding: 48px 16px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Session settlements</h1>
    <div class="summary" id="summary">Ładowanie…</div>
  </header>
  <div id="warn" class="warn" style="display:none"></div>
  <div class="controls">
    <button id="startBtn">Start eval</button>
    <button id="stopBtn" class="secondary">Stop</button>
    <button id="refreshBtn" class="secondary">Refresh</button>
  </div>
  <div class="list" id="rows"><div class="empty">Brak rozliczeń w tym oknie</div></div>
  <script>
    async function load() {
      let data;
      try {
        const res = await fetch('/api/status');
        data = await res.json();
      } catch (e) {
        document.getElementById('summary').textContent = 'Brak połączenia z serwerem';
        return;
      }
      const warn = document.getElementById('warn');
      if (!data.wallet_configured) {
        warn.style.display = 'block';
        warn.textContent = 'Ustaw configs/monitor.json — poly_wallet.';
      } else if (data.error) {
        warn.style.display = 'block';
        warn.textContent = 'API error: ' + data.error;
      } else {
        warn.style.display = 'none';
      }
      const net = data.in_window_net || 0;
      const netClass = net >= 0 ? 'positive' : 'negative';
      const netSign = net >= 0 ? '+' : '';
      document.getElementById('summary').innerHTML =
        `${data.resolved_count} resolved this eval · ` +
        `<span class="${netClass}">in-window net ${netSign}$${net.toFixed(2)}</span>` +
        (data.session_active ? '' : ' · <span class="negative">eval stopped</span>');

      const list = document.getElementById('rows');
      list.innerHTML = '';
      const settlements = data.settlements || [];
      if (!settlements.length) {
        list.innerHTML = '<div class="empty">Brak rozliczeń w tym oknie</div>';
        return;
      }
      for (const s of settlements) {
        const card = document.createElement('div');
        card.className = 'card ' + (s.pnl >= 0 ? 'win' : 'loss');
        const sign = s.pnl >= 0 ? '+' : '';
        card.innerHTML =
          `<div class="meta">` +
          `<div class="market">${s.market}</div>` +
          `<div class="sub"><span class="badge">${s.outcome}</span> · ${s.time_local || ''}</div>` +
          `</div>` +
          `<div class="pnl ${s.pnl >= 0 ? 'positive' : 'negative'}">${sign}$${s.pnl.toFixed(2)}</div>`;
        list.appendChild(card);
      }
    }
    document.getElementById('refreshBtn').onclick = load;
    document.getElementById('startBtn').onclick = async () => { await fetch('/api/eval/start', { method: 'POST' }); load(); };
    document.getElementById('stopBtn').onclick = async () => { await fetch('/api/eval/stop', { method: 'POST' }); load(); };
    load();
    setInterval(load, 45000);
  </script>
</body>
</html>
