name: hunt-and-publish

# One long loop so a skipped GitHub cron does not leave the board idle.
# Watchdog every ~20 min starts a new loop only if none is running
# (concurrency: one in-flight + one pending). Hunt never enables copy.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

concurrency:
  group: copy-lab-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HUNT_LOOP_MINUTES: "330"
      HUNT_PAUSE_SEC: "600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install hunt deps
        run: pip install "httpx>=0.27.0"
      - name: Hunt loop (does not enable copy)
        run: bash scripts/hunt_loop.sh
      - name: Commit last hunt snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/data/hunt.json ops/data/pulse.json ops/data/solutions.json
          git diff --cached --quiet || git commit -m "chore: hunt snapshot"
          git push || true
